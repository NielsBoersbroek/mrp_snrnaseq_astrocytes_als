name: r_scrnaseq_core
channels: 
- conda-forge
- bioconda
dependencies:
- r-base=4.5.2
- r-seurat=5.5
- r-tidyverse=2
- r-harmony=2.0.5
- r-clustree
- leidenalg=0.12.0 # needed to run Leiden algorithm in Seurat::FindClusters()
- r-languageserver # to use R language service on VS Code
- r-rmarkdown
# For script 05_slingshot
- bioconductor-slingshot=2.18
- bioconductor-tradeseq=1.24.0
- r-viridis
# For script 07_milo
- bioconductor-milor=2.6
- bioconductor-singlecellexperiment
# For script 08_hdwgcna.R
- r-wgcna=1.74
- r-devtools # To install hdWGCNA
- bioconductor-ucell
- bioconductor-genomicranges
- bioconductor-geneoverlap
