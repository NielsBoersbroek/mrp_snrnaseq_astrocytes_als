name: r_scrnaseq_core
channels: 
- conda-forge
- bioconda
dependencies:
- r-base=4.4.3
- r-tidyverse=2.0.0
- r-languageserver # to use R language service on VS Code

# General single-cell packages
- r-seurat=5.5
- r-harmony=2.0.5
- r-clustree
- leidenalg=0.12.0 # needed to run Leiden algorithm in Seurat::FindClusters()
- r-presto # drastically speeds up Seurat::FindMarkers()

# For GO-term GSEA
- bioconductor-fgsea=1.32.2
- r-msigdbr=26.1.1

# For script 05_slingshot
- bioconductor-slingshot=2.14.0
- bioconductor-tradeseq=1.20.0
- r-viridis

# For script 07_milo
- bioconductor-milor=2.2.0
- bioconductor-singlecellexperiment=1.28.0

# For script 08_hdwgcna.R
- r-wgcna=1.74
- r-devtools # To install hdWGCNA
- bioconductor-ucell
- bioconductor-genomicranges
- bioconductor-geneoverlap

# For using quarto
- r-knitr
- quarto
